name: EncoreMoment
options:
  bundleIdPrefix: com.encoremoment
  xcodeVersion: "16.0"
  projectFormat: xcode14_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  EncoreMomentCore:
    path: .

targets:
  EncoreMoment:
    type: application
    platform: iOS
    sources:
      - path: App/EncoreMoment
    dependencies:
      - package: EncoreMomentCore
        product: EncoreMomentCore
    info:
      path: App/EncoreMoment/Info.plist
      properties:
        CFBundleDisplayName: EncoreMoment
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: "Save event photos and videos to your library so you can use them however you like."
        NSPhotoLibraryUsageDescription: "Pick photos and videos from your library to post to your events."
        CFBundleURLTypes:
          - CFBundleURLName: com.encoremoment.app
            CFBundleURLSchemes:
              - encoremoment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.encoremoment.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
